name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  go-test:
    name: Go Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install ML dependencies
        run: pip install -r requirements.txt

      - name: Generate V2 transaction dataset
        run: PYTHONPATH=. python3 ml/features/generate_transactions_v2.py

      - name: Generate prediction stream
        run: PYTHONPATH=. python3 ml/training/generate_prediction_stream.py

      - name: Run Go tests
        working-directory: backend
        run: go test ./...

      - name: Run Go race tests
        working-directory: backend
        run: go test -race ./...

  python-test:
    name: Python Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run Python tests
        run: python -m pytest -q

      - name: Compile Python sources
        run: |
          python -m py_compile \
            model_service/app.py \
            ml/features/feature_contract.py \
            ml/features/feature_engineering.py \
            ml/inference/predict.py \
            ml/training/train_model.py \
            ml/training/tune_threshold.py

  monitoring-validation:
    name: Monitoring Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Prometheus rules
        run: |
          docker run --rm \
            -v "$PWD/monitoring:/etc/prometheus" \
            prom/prometheus:latest \
            promtool check rules /etc/prometheus/alerts.yml

      - name: Validate Prometheus config
        run: |
          docker run --rm \
            -v "$PWD/monitoring:/etc/prometheus" \
            prom/prometheus:latest \
            promtool check config /etc/prometheus/prometheus.yml

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker images
        env:
          POSTGRES_DB: risk_manager
          POSTGRES_USER: risk_user
          POSTGRES_PASSWORD: ci_password
          POSTGRES_HOST: postgres
          POSTGRES_PORT: 5432
          ML_SERVICE_URL: http://ml-service:8000/predict
        run: docker compose build